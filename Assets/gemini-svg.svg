<svg width="780" height="70" viewBox="0 0 780 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .neon-bg {
        fill: #0D1117;
        stroke: #22D3EE;
        stroke-width: 1.5;
        stroke-opacity: 0.25;
      }

      .static-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 21px;
        font-weight: 700;
      }

      /* Outer Gas Bloom */
      .neon-outer {
        font-family: 'JetBrains Mono', monospace;
        font-size: 22px;
        font-weight: 800;
        fill: none;
        stroke: #22D3EE;
        stroke-width: 8px;
        stroke-linejoin: round;
        stroke-linecap: round;
        opacity: 0.35;
        filter: blur(6px);
        animation: neon-hum 4s infinite steps(1, end);
      }

      /* Mid Glow Layer */
      .neon-mid {
        font-family: 'JetBrains Mono', monospace;
        font-size: 22px;
        font-weight: 800;
        fill: none;
        stroke: #22D3EE;
        stroke-width: 3.5px;
        stroke-linejoin: round;
        stroke-linecap: round;
        opacity: 0.85;
        filter: blur(1.5px);
        animation: neon-hum 4s infinite steps(1, end);
      }

      /* White-Hot Core Gas */
      .neon-core {
        font-family: 'JetBrains Mono', monospace;
        font-size: 22px;
        font-weight: 800;
        fill: #FFFFFF;
        stroke: #E0F2FE;
        stroke-width: 0.8px;
        stroke-linejoin: round;
        stroke-linecap: round;
        animation: neon-hum 4s infinite steps(1, end);
      }

      /* Authentic Ballast / Gas Discharge Behavior */
      @keyframes neon-hum {
        0%, 100% { opacity: 0.95; }
        4% { opacity: 0.88; }
        5% { opacity: 0.98; }
        6% { opacity: 0.82; }
        32% { opacity: 0.3; }
        32.5% { opacity: 0.9; }
        33% { opacity: 0.15; }
        33.8% { opacity: 0.95; }
        65% { opacity: 0.92; }
        78% { opacity: 0.25; }
        78.4% { opacity: 0.98; }
        91% { opacity: 0.85; }
        91.3% { opacity: 0.4; }
        91.6% { opacity: 0.96; }
      }
    </style>
  </defs>

  <!-- Industrial Dark Glass Backing Card -->
  <rect x="2" y="2" width="776" height="66" rx="8" class="neon-bg" />

  <!-- Layer 1: Static Prefix + Outer Glow Bloom -->
  <text x="390" y="43" text-anchor="middle">
    <tspan class="static-label" fill="#8B949E">Hi 👋, I'm </tspan>
    <tspan class="neon-outer">Abhi Raval</tspan>
  </text>

  <!-- Layer 2: Mid Glow (Synced Spacing) -->
  <text x="390" y="43" text-anchor="middle">
    <tspan class="static-label" fill="transparent">Hi 👋, I'm </tspan>
    <tspan class="neon-mid">Abhi Raval</tspan>
  </text>

  <!-- Layer 3: White-Hot Core (Synced Spacing) -->
  <text x="390" y="43" text-anchor="middle">
    <tspan class="static-label" fill="transparent">Hi 👋, I'm </tspan>
    <tspan class="neon-core">Abhi Raval</tspan>
  </text>
</svg>