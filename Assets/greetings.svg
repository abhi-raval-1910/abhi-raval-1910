<svg width="780" height="70" viewBox="0 0 780 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      
      
      .neon-bg {
        fill: #0D1117;
        stroke: #22D3EE;
        stroke-width: 1;
        stroke-opacity: 0.25;
        rx: 8px;
      }

      .static-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 21px;
        font-weight: 700;
        fill: #8B949E;
      }

      /* Outer Gas Bloom */
      .neon-outer {
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        font-weight: 800;
        fill: none;
        stroke: #22D3EE;
        stroke-width: 8px;
        stroke-linejoin: round;
        stroke-linecap: round;
        opacity: 0.35;
        filter: blur(3px);
        animation: neon-hum 4s infinite steps(1, end);
      }

      /* Mid Glow Layer */
      .neon-mid {
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        font-weight: 800;
        fill: none;
        stroke: #22D3EE;
        stroke-width: 3.5px;
        stroke-linejoin: round;
        stroke-linecap: round;
        opacity: 0.85;
        filter: blur(1.5px);
        animation: neon-hum 4s infinite steps(1, end);
      }

      /* White-Hot Core Gas */
      .neon-core {
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        font-weight: 800;
        fill: #FFFFFF;
        stroke: #E0F2FE;
        stroke-width: 0.8px;
        stroke-linejoin: round;
        stroke-linecap: round;
        animation: neon-hum 4s infinite steps(1, end);
      }

      /* Authentic Ballast / Gas Discharge Behavior */
      @keyframes neon-hum {
        0%, 100% { opacity: 0.95; }
        /* Rapid micro-ripple hum */
        4% { opacity: 0.88; }
        5% { opacity: 0.98; }
        6% { opacity: 0.82; }
        
        /* Sudden double-stutter ignition burst */
        32% { opacity: 0.3; }
        32.5% { opacity: 0.9; }
        33% { opacity: 0.15; }
        33.8% { opacity: 0.95; }
        
        /* Stable burn with subtle current drop */
        65% { opacity: 0.92; }
        78% { opacity: 0.25; }
        78.4% { opacity: 0.98; }
        
        /* Quick thermal flutter */
        91% { opacity: 0.85; }
        91.3% { opacity: 0.4; }
        91.6% { opacity: 0.96; }
      }
    </style>
  </defs>

  <!-- Industrial Dark Glass Backing Card -->
  <rect x="2" y="2" width="776" height="66" class="neon-bg" />

  <!-- Text Group -->
  <text x="390" y="43" text-anchor="middle">
    <tspan class="static-label" dx="-10">Hi 👋, I'm </tspan>
    <tspan class="neon-outer" dx="10">Abhi Raval</tspan>
    <tspan class="neon-mid" dx="-151">Abhi Raval</tspan>
    <tspan class="neon-core" dx="-151">Abhi Raval</tspan>
  </text>
</svg>
